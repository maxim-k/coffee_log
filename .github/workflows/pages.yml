# Build the coffee notes into static pages with .site/build.mjs and publish
# them on GitHub Pages.
name: Pages

on:
  push:
    branches: [site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # The home page orders bags by the date they were added.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build
        working-directory: .site
        run: |
          npm ci
          node build.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
